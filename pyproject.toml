[project]
name = "learn-agents"
version = "0.1.0"
requires-python = ">=3.11,<4.0"
dependencies = [
  "langchain[openai]>=1.4.2,<1.5",
  "langgraph>=1.2.12,<1.3",
  "langsmith>=0.14.1,<0.15",
  "deepagents>=0.7.19,<0.8",
]

[dependency-groups]
dev = [
  "ipykernel>=6.30",
  "jupyterlab>=4.4",
  "pytest>=8.4",
  "nbclient>=0.10",
  "nbformat>=5.10",
  "numpy>=2.0",
]

[project.optional-dependencies]
alternatives = [
  "openai-agents[voice]>=0.18.2,<0.19",
  "pydantic-ai>=2.9.0,<3",
  "llama-index>=0.14.23,<0.15",
  "google-adk[a2a]>=2.4.0,<3",
  "agno>=2.7.2,<2.8",
]
